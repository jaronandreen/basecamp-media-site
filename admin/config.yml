backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://basecampmediaco.com
display_url: https://basecampmediaco.com
logo_url: https://basecampmediaco.com/images/logo.png

collections:

  # ── BLOG POSTS & ADVENTURE LOGS ──────────────────────────────────────
  - name: "posts"
    label: "Blog Posts & Adventure Logs"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "The post headline — make it punchy" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Adventure Log", value: "adventure-log" }
          - { label: "Gear Review", value: "gear-review" }
          - { label: "The Rig", value: "the-rig" }
          - { label: "Movement & Body", value: "movement-body" }
          - { label: "The Framework", value: "the-framework" }
          - { label: "Van Life", value: "van-life" }
          - { label: "Moto", value: "moto" }
          - { label: "Gravel & Bikepacking", value: "gravel-bikepacking" }
          - { label: "Paragliding", value: "paragliding" }
      - { label: "Subtitle / Excerpt", name: "excerpt", widget: "text", hint: "1-2 sentences shown in the blog preview card" }
      - { label: "Featured Image", name: "thumbnail", widget: "image", required: false }
      - label: "Status"
        name: "status"
        widget: "select"
        default: "draft"
        options:
          - { label: "Draft", value: "draft" }
          - { label: "Published", value: "published" }
      - { label: "Featured on Homepage", name: "featured", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown", hint: "Write your post here. Full rich text editor." }
      - label: "Affiliate Links in Post"
        name: "affiliate_links"
        widget: "list"
        required: false
        summary: "{{fields.label}}"
        fields:
          - { label: "Item Name", name: "label", widget: "string" }
          - { label: "URL", name: "url", widget: "string" }

  # ── HOMEPAGE CONTENT ──────────────────────────────────────────────────
  - name: "homepage"
    label: "Homepage"
    files:
      - label: "Homepage Content"
        name: "homepage"
        file: "_data/homepage.yml"
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Main Headline Line 1", name: "line1", widget: "string", default: "LIVE THE" }
              - { label: "Main Headline Line 2", name: "line2", widget: "string", default: "ADVENTURE." }
              - { label: "Main Headline Line 3", name: "line3", widget: "string", default: "SHARE THE GEAR." }
              - { label: "Subtext", name: "subtext", widget: "text", default: "Gravel cycling, bikepacking, dual sport moto, paragliding, and van life — we chase the hard stuff and tell you exactly what it took." }
              - { label: "Location tagline", name: "location", widget: "string", default: "Jaron & Reen · Chattanooga, TN" }

          - label: "Content Pillars"
            name: "pillars"
            widget: "list"
            summary: "{{fields.number}} — {{fields.title}}"
            fields:
              - { label: "Number", name: "number", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

          - label: "Gear Room Section"
            name: "gear_room"
            widget: "object"
            fields:
              - { label: "Section Title", name: "title", widget: "string", default: "The Gear Room" }
              - { label: "Intro Text", name: "intro", widget: "text" }

          - label: "Email Capture"
            name: "email_capture"
            widget: "object"
            fields:
              - { label: "Headline", name: "headline", widget: "string", default: "THE BASECAMP GEAR LIST" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Fine print", name: "fine_print", widget: "string", default: "No spam. Unsubscribe anytime." }

          - label: "About / Work With Us"
            name: "collab"
            widget: "object"
            fields:
              - { label: "Section Title", name: "title", widget: "string", default: "Work With Us" }
              - { label: "Body text", name: "body", widget: "text" }
              - { label: "Contact Email", name: "email", widget: "string", default: "hello@basecampmedia.co" }

  # ── SITE SETTINGS ─────────────────────────────────────────────────────
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General Settings"
        name: "general"
        file: "_data/settings.yml"
        fields:
          - { label: "Site Name", name: "site_name", widget: "string", default: "Basecamp Media" }
          - { label: "Tagline", name: "tagline", widget: "string", default: "Live the Adventure. Share the Gear." }
          - { label: "Contact Email", name: "email", widget: "string", default: "hello@basecampmedia.co" }
          - { label: "Location", name: "location", widget: "string", default: "Chattanooga, TN" }
          - label: "Social Links"
            name: "social"
            widget: "object"
            fields:
              - { label: "Instagram URL", name: "instagram", widget: "string", default: "https://instagram.com/jaronandreen" }
              - { label: "TikTok URL", name: "tiktok", widget: "string", default: "https://tiktok.com/@thebasecamp.outdoors" }
              - { label: "YouTube URL", name: "youtube", widget: "string", default: "https://youtube.com/@jaronandreen" }
          - label: "Affiliate Programs"
            name: "affiliates"
            widget: "object"
            fields:
              - { label: "Amazon Associates Tag", name: "amazon_tag", widget: "string" }
              - { label: "LTK Profile URL", name: "ltk_url", widget: "string" }
              - { label: "Mailchimp Form URL", name: "mailchimp_url", widget: "string" }
